name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | cut -d'.' -f1)
          if [ -z "$JAVA_VERSION" ]; then
            echo "Failed to detect Java version."
            exit 1
          fi
          if [ "$JAVA_VERSION" -lt 17 ]; then
            echo "Java version is $JAVA_VERSION, which is lower than 17."
            exit 1
          fi
          echo "Java version $JAVA_VERSION verified."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            echo "Generating temporary debug.keystore..."
            keytool -genkey -v -keystore ./debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
            if [ ! -f "./debug.keystore" ]; then
              echo "Failed to create debug.keystore"
              exit 1
            fi
            echo "Keystore created successfully."
          else
            echo "debug.keystore already exists."
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Expected APK not found at $EXPECTED_APK."
            echo "Searching inside app/build/outputs/apk:"
            find app/build/outputs/apk -type f
            exit 1
          fi
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "APK exists but is empty."
            exit 1
          fi
          echo "Verified APK exists at $EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          mkdir -p /tmp/release-asset
          REPO_NAME=$(basename "${{ github.repository }}" | tr -cd 'A-Za-z0-9_-')
          APK_NAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "/tmp/release-asset/$APK_NAME"
          echo "release_apk=/tmp/release-asset/$APK_NAME" >> $GITHUB_OUTPUT
          echo "release_filename=$APK_NAME" >> $GITHUB_OUTPUT

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          APK_PATH="${{ steps.prepare_asset.outputs.release_apk }}"
          if [ ! -s "$APK_PATH" ]; then
            echo "Release asset does not exist or is empty at $APK_PATH"
            exit 1
          fi
          
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          
          NOTES="This is an automatically generated debug APK.
          Built by GitHub Actions.
          Run number: ${{ github.run_number }}
          Run attempt: ${{ github.run_attempt }}
          Source commit SHA: ${{ github.sha }}
          
          Intended for testing only. Not a Play Store production release.
          Signed only with a temporary debug keystore."
          
          gh release create "$TAG" "$APK_PATH" \
            --title "$TITLE" \
            --target "${{ github.sha }}" \
            --notes "$NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          if [ "${{ steps.create_release.outcome }}" == "success" ]; then
            echo "Release publishing succeeded!"
            gh release view "$TAG"
            RELEASE_URL=$(gh release view "$TAG" --json url -q .url)
            echo "Release Tag: $TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: $RELEASE_URL"
            echo "Release Asset Filename: ${{ steps.prepare_asset.outputs.release_filename }}"
            
            echo "### ✅ APK Build and Release Successful" >> $GITHUB_STEP_SUMMARY
            echo "The APK can be downloaded directly from the GitHub Release Assets section." >> $GITHUB_STEP_SUMMARY
            echo "**Release URL:** $RELEASE_URL" >> $GITHUB_STEP_SUMMARY
            echo "**Release Asset Filename:** ${{ steps.prepare_asset.outputs.release_filename }}" >> $GITHUB_STEP_SUMMARY
            echo "The normal Actions artifact (\`app-debug-apk\`) is also available as a backup." >> $GITHUB_STEP_SUMMARY
          else
            echo "WARNING: Release publishing failed."
            echo "However, the APK build succeeded."
            echo "The Actions artifact named 'app-debug-apk' remains available."
            
            echo "### ⚠️ Release Publishing Failed" >> $GITHUB_STEP_SUMMARY
            echo "The APK build succeeded, but it could not be published to GitHub Releases." >> $GITHUB_STEP_SUMMARY
            echo "The Actions artifact named \`app-debug-apk\` remains available on the workflow run page as a backup." >> $GITHUB_STEP_SUMMARY
          fi
